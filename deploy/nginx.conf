server {
    listen 80;
    server_name your-domain-or-ip;   # <- замени на свой домен или IP

    root /var/www/matchday;          # <- папка с файлами сайта
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # HTML всегда свежий, ассеты кэшируются браузером
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /css/  { add_header Cache-Control "public, max-age=86400"; }
    location /js/   { add_header Cache-Control "public, max-age=86400"; }
    location ~* \.(svg|png|ico|webmanifest)$ { add_header Cache-Control "public, max-age=604800"; }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / { try_files $uri $uri/ /index.html; }
}