<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08161A">
<meta name="description" content="MATCHDAY — live scores, fixtures and model probabilities for football, basketball, tennis and hockey.">
<meta property="og:title" content="MATCHDAY — Live Sports & Analytics">
<meta property="og:description" content="Fixtures, live scores and match probabilities in one clean feed.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>MATCHDAY — Live Sports & Analytics</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="top">
  <div class="wrap topin">
    <a class="logo" href="#/home" data-action="tab" data-route="home">
      <span class="lbadge" id="logoIcon"></span>
      <span class="lword">MATCHDAY<span class="ldot">.</span></span>
    </a>
    <label class="search">
      <span class="sicon" id="searchIcon"></span>
      <input id="q" type="text" autocomplete="off" placeholder="Team, tournament, event...">
    </label>
    <button class="iconbtn" data-action="bell" aria-label="Notifications">
      <span id="bellIcon"></span>
      <span class="bdot" id="bellBadge" hidden>0</span>
    </button>
  </div>
</header>

<div class="statusbar" id="statusbar"></div>

<main id="app" class="wrap"></main>

<nav class="tabbar" id="tabbar"></nav>
<div id="toasts"></div>

<script src="js/config.js?v=2"></script>
<script src="js/utils.js?v=2"></script>
<script src="js/demo.js?v=2"></script>
<script src="js/predict.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/pages.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
